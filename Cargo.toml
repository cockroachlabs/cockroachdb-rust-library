[workspace]
resolver = "2"
members = [
    "crates/cockroachdb-core",
    "crates/cockroachdb-sqlx",
    "crates/cockroachdb-macros",
    "crates/cockroachdb-cdc",
    "crates/cockroachdb-ai",
    "crates/cockroachdb-continuum",
    "crates/cockroachdb-seaorm",
    "crates/cockroachdb-testing",
    "examples/ideas-board",
]

# Future members (built by the fleet after the foundation is green):
#   "crates/cockroachdb-seaorm",
#   "crates/cockroachdb-cdc",
#   "crates/cockroachdb-ai",
#   "crates/cockroachdb-continuum",
#   "crates/cockroachdb-macros",
#   "crates/cockroachdb-testing",

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/cockroachlabs/cockroachdb-rust-library"
homepage = "https://cockroachlabs.github.io/cockroachdb-rust-library/"
authors = ["Cockroach Labs"]

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls"] }
thiserror = "2"
futures = "0.3"
async-trait = "0.1"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Internal crates: `path` is used for local dev/build; `version` + `registry`
# are what `cargo package` records so consumers resolve them from the Pages feed.
cockroachdb-core = { path = "crates/cockroachdb-core", version = "0.2.0", registry = "cockroachlabs" }
cockroachdb-sqlx = { path = "crates/cockroachdb-sqlx", version = "0.2.0", registry = "cockroachlabs" }
cockroachdb-macros = { path = "crates/cockroachdb-macros", version = "0.2.0", registry = "cockroachlabs" }
cockroachdb-cdc = { path = "crates/cockroachdb-cdc", version = "0.2.0", registry = "cockroachlabs" }
cockroachdb-ai = { path = "crates/cockroachdb-ai", version = "0.2.0", registry = "cockroachlabs" }
cockroachdb-continuum = { path = "crates/cockroachdb-continuum", version = "0.2.0", registry = "cockroachlabs" }
cockroachdb-seaorm = { path = "crates/cockroachdb-seaorm", version = "0.2.0", registry = "cockroachlabs" }
cockroachdb-testing = { path = "crates/cockroachdb-testing", version = "0.2.0", registry = "cockroachlabs" }
