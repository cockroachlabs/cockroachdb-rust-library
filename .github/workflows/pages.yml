name: Pages

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build API docs (rustdoc)
        run: cargo doc --no-deps --workspace

      - name: Build sparse Cargo registry + landing page
        run: python3 scripts/build-registry.py --out _site

      - name: Assemble rustdoc into the site
        run: |
          mkdir -p _site/doc
          cp -r target/doc/* _site/doc/

      - name: Publish consumer AGENTS.md + llms.txt
        run: |
          mkdir -p _site/agents
          cp docs/agents/AGENTS.md _site/agents/AGENTS.md
          cat > _site/llms.txt <<'EOF'
          # cockroachdb-rust-library

          Consumer guide for coding agents working in a Rust app that depends on
          this library (what it already handles, which symbol for each job):
          https://cockroachlabs.github.io/cockroachdb-rust-library/agents/AGENTS.md
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          publish_branch: gh-pages
