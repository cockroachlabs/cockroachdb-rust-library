name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: build, clippy, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace
      - name: Unit & doc tests (no database)
        run: cargo test --workspace

  integration:
    name: integration tests (live cluster)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start CockroachDB
        run: |
          # Pinned to a released minor (v25.2+ provides the VECTOR type). Vector
          # search runs brute-force here; the C-SPANN index (v26.2+) is best-effort.
          docker run -d --name crdb -p 26257:26257 \
            cockroachdb/cockroach:latest-v25.2 start-single-node --insecure
          for i in $(seq 1 60); do
            if docker exec crdb ./cockroach sql --insecure -e 'SELECT 1' >/dev/null 2>&1; then
              echo "CockroachDB ready"; break
            fi
            sleep 2
          done
          # defaultdb normally exists, but create it explicitly to avoid a race
          # between SQL becoming available and the database being created.
          docker exec crdb ./cockroach sql --insecure -e 'CREATE DATABASE IF NOT EXISTS defaultdb'
      - name: Run ignored (DB-backed) tests
        env:
          CRDB_URL: postgres://root@localhost:26257/defaultdb?sslmode=disable
        # --tests runs only unit/integration test targets (not doctests): `cargo
        # test -- --ignored` would otherwise execute ````ignore` doctests, which
        # are meant to be skipped.
        run: cargo test --workspace --tests -- --ignored
