[package]
name = "cockroachdb-sqlx"
description = "SQLx adapter for CockroachDB: transaction retries on 40001, follower reads, isolation control, metrics, health."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# `include` overrides cargo's defaults, so src/** must be listed explicitly.
# docs/agents/AGENTS.md is the consumer guide baked into the published .crate
# (kept identical to the repo-root copy at docs/agents/AGENTS.md).
include = ["src/**/*", "docs/agents/AGENTS.md"]

[dependencies]
cockroachdb-core = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
